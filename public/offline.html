<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fff8fa" />
    <title>도담 — 연결 확인</title>
    <style>
      html, body { margin: 0; height: 100%; background: #fff8fa; color: #3a2d32; font-family: system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px 16px; box-sizing: border-box; text-align: center; }
      h1 { margin: 0; font-size: 20px; }
      p { margin: 0; font-size: 14px; line-height: 1.6; color: #7a6c72; }
      button { margin-top: 8px; min-width: 160px; height: 48px; border: 0; border-radius: 14px; background: #D1456C; color: #fff; font: inherit; font-size: 15px; font-weight: 700; cursor: pointer; }
      button:focus-visible { outline: 3px solid #F3A3B8; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>인터넷 연결을 확인해 주세요</h1>
      <p>지금은 도담에 연결할 수 없어요.<br />연결된 뒤 다시 시도해 주세요.</p>
      <button type="button" onclick="location.reload()">다시 시도</button>
    </main>
  </body>
</html>
